<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAMPGRID - Algorithmic Engineering</title>
    <style>
        :root { --bg: #010306; --cyan: #00e5ff; --text: #ffffff; --text-dim: #888; --green: #00ffa3; --red: #ff3366; --border: rgba(255,255,255,0.1); }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); font-family: 'Arial', sans-serif; cursor: none; overflow-x: hidden; }
        .mono { font-family: monospace; }
        
        /* Cursor CSS */
        .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
        .cursor-dot { width: 5px; height: 5px; background: var(--cyan); border-radius: 50%; }
        .cursor-ring { width: 25px; height: 25px; border: 1px solid var(--cyan); border-radius: 50%; transition: width 0.2s, height 0.2s; }

        /* Ticker CSS */
        #ticker-container { position: fixed; top: 70px; width: 100%; height: 44px; background: #010306; border-bottom: 1px solid var(--border); z-index: 99; display: flex; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .ticker-label { background: var(--cyan); color: #000; padding: 0 20px; font-weight: 700; display: flex; align-items: center; font-size: 12px; letter-spacing: 1px; z-index: 2; height: 100%; border-right: 2px solid var(--cyan); }
        .ticker-wrapper { display: flex; white-space: nowrap; animation: slideLeft 25s linear infinite; align-items: center; height: 100%; }
        .ticker-wrapper:hover { animation-play-state: paused; }
        .tick-item { display: flex; align-items: center; padding: 0 30px; border-right: 1px solid rgba(255,255,255,0.05); font-size: 14px; gap: 10px; }
        .tick-price { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .flash-up { color: var(--green); text-shadow: 0 0 10px rgba(0, 255, 163, 0.4); }
        .flash-down { color: var(--red); text-shadow: 0 0 10px rgba(255, 51, 102, 0.4); }
        @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>

    <!-- CUSTOM CURSOR -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <!-- LIVE API TICKER -->
    <div id="ticker-container">
        <div class="ticker-label mono">SYS.STATUS: ONLINE</div>
        <div class="ticker-wrapper" id="ticker-track">
            <div class="tick-item mono"><span style="color: var(--cyan);">[!] FETCHING SECURE API DATA...</span></div>
        </div>
    </div>

    <script>
        // 1. FAST CURSOR ANIMATION (No Lag)
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            dot.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
        });

        function animateRing() {
            ringX += (mouseX - ringX) * 0.4; // Speed bada di hai
            ringY += (mouseY - ringY) * 0.4;
            ring.style.transform = `translate(calc(${ringX}px - 50%), calc(${ringY}px - 50%))`;
            requestAnimationFrame(animateRing);
        }
        animateRing();

        // 2. LIVE MARKET DATA FETCH ENGINE
        async function fetchLiveData() {
            // Yahan aapke Render server ka link hai
            const url = `https://dhan-secure-server.onrender.com/live-prices`;

            try {
                const res = await fetch(url);
                const responseData = await res.json();
                
                if(responseData.status === "success") {
                    let html = '';
                    responseData.data.forEach(q => {
                        const isUp = q.change.includes('+');
                        const color = isUp ? 'flash-up' : 'flash-down';
                        
                        let marketStatus = "";
                        if(q.status === 'CLOSED') {
                            marketStatus = ' <span style="font-size:11px; color:#555; font-style:italic;">[RECLOSE]</span>';
                        }

                        html += `<div class="tick-item"><span style="color: var(--text-dim);">${q.symbol}</span><span class="tick-price ${color}">${q.price} (${q.change}%)</span>${marketStatus}</div>`;
                    });

                    // Ticker continuous chalne ke liye usko 4 baar repeat kiya hai
                    document.getElementById('ticker-track').innerHTML = html + html + html + html;
                }
            } catch(e) {
                console.log("Waiting for Secure Server...");
            }
        }

        fetchLiveData(); // Website khulte hi data layega
        setInterval(fetchLiveData, 3000); // Har 3 second mein refresh karega
    </script>
</body>
</html>
